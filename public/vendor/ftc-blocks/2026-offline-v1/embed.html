<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <title>FTC Blocks editor</title>
    <script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";</script>
    <link rel="stylesheet" href="blocks/images.css">
    <link rel="stylesheet" href="css/blocks_offline.css">
    <link rel="stylesheet" href="css/blocks_common_less.css">
    <link rel="stylesheet" href="css/blocks_common.css">
    <link rel="stylesheet" href="embed.css?v=6">
    <script src="asset-manifest.js" defer></script>
    <script src="bridge.js?v=5" defer></script>
  </head>
  <body>
    <div class="embed-metadata" aria-hidden="true">
      <span id="project_name"></span>
      <select id="project_flavor">
        <option value="TELEOP">TeleOp</option>
        <option value="AUTONOMOUS">Autonomous</option>
      </select>
      <input id="project_group" type="text">
      <input id="project_enabled" type="checkbox" checked>
      <span id="project_autoTransition_label"></span>
      <select id="project_autoTransition"></select>
      <input id="show_java" type="checkbox">
      <button id="downloadImageButton" type="button" disabled></button>
      <a id="download_link"></a>
      <span id="saveSuccess"></span>
      <span id="saveFailure"></span>
    </div>

    <main id="parentArea" class="parent_area horizontal_area fill_area no_min_height">
      <div id="blocksAndBannerArea" class="vertical_area">
        <div id="banner" class="banner" hidden>
          <span id="bannerText" class="banner_text"></span>
          <button id="bannerBtn" type="button">Resolve</button>
        </div>
        <div id="blocklyArea" class="fill_area"></div>
      </div>
      <div id="javaArea" hidden>
        <pre id="javaContent"></pre>
      </div>
    </main>

    <div id="blocklyDiv"></div>
    <xml id="toolbox" style="display: none">
      <category name="Miscellaneous"></category>
    </xml>
    <div id="saveWithWarningsDialog" hidden>
      <div id="saveWithWarningsMessage"></div>
    </div>
  </body>
</html>
